[project]
name = "incypher-bridge"
version = "0.1.0"
description = "Temporary human-inspectable PoW TCP bridge for IN-CYPHER raw-TCP challenge instances"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["solver", "bridge"]

[tool.setuptools.packages.find]
where = ["src"]
