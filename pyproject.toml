[project]
name = "incypher-arena-agent"
version = "1.0.0"
description = "Autonomous CTF agent for the IN-CYPHER Arena"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0,<2",
    "Pillow>=10.0",
    "numpy>=1.26",
    "pydicom>=2.4",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["arena*"]
