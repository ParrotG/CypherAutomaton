[project]
name = "incypher-bridge"
version = "0.1.0"
description = "Temporary IN-CYPHER PoW TCP bridge + minimal DeepSeek-style autonomous agent unit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
]

[project.scripts]
incypher-bridge = "incypher_bridge.cli:main"
incypher-agent = "incypher_agent.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["solver", "bridge"]

[tool.setuptools.packages.find]
where = ["src"]
