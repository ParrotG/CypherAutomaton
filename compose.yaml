services:
  bridge:
    build:
      context: .
    image: incypher-bridge:local
    command:
      - incypher-bridge
      - serve
      - --api-host
      - 0.0.0.0
      - --api-port
      - "8765"
      - --state-dir
      - /data/bridge
      - --env-file
      - /app/.env.local
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./.env.local:/app/.env.local:ro
      - ./.cypher_bridge/docker-bridge:/data/bridge
    restart: unless-stopped
